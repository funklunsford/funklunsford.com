<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>funklunsford</title>
    <meta name="description" content="Puzzles, Substack and poetry." />
    <meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1e18" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&amp;display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21 C 7.5 15.5, 11.5 10.5, 19 4"/><path d="M8.9 14.5 C 5.9 14.1, 3.9 11.5, 3.7 8.1 C 6.9 8.7, 8.9 11.3, 8.9 14.5 Z" fill="currentColor" fill-opacity="0.25"/><path d="M11.6 11.2 C 13.6 9.2, 16.6 8.8, 19.6 10.4 C 17.4 12.6, 14.4 12.8, 11.6 11.2 Z" fill="currentColor" fill-opacity="0.25"/></svg>
        funklunsford
      </a>
      <nav class="site-nav" aria-label="Sections">
        <a href="/substack/">Substack</a>
        <a href="/puzzles/">Puzzles</a>
        <a href="/poetry/">Poetry</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div>
          <h1>Hiya <span class="wave" role="img" aria-label="waving hand">👋</span></h1>
        </div>
        <figure class="hero-art" aria-hidden="true">
          <div class="blob"></div>
          <div class="blob blob--seed"></div>
          <svg class="sprig" viewBox="0 0 220 260">
            <defs>
              <g id="leaf">
                <path d="M0 0 C 10 -12, 32 -15, 52 -4 C 36 8, 14 9, 0 0 Z" vector-effect="non-scaling-stroke" />
                <path d="M3 -0.5 C 18 -3, 33 -4.5, 47 -4" fill="none" vector-effect="non-scaling-stroke" />
              </g>
            </defs>
            <path class="stem" d="M70 251 C 90 247.5, 130 254, 154 249.5" vector-effect="non-scaling-stroke" />
            <path class="stem" d="M112 250 C 108 205, 116 168, 108 128 C 101 92, 104 56, 122 18" vector-effect="non-scaling-stroke" />
            <g class="leaves">
              <use href="#leaf" transform="translate(110.8 217.6) rotate(-22)" />
              <use href="#leaf" transform="translate(111.5 187) rotate(-158) scale(0.95 -0.95)" />
              <use href="#leaf" transform="translate(111.4 157.6) rotate(-32) scale(0.9)" />
              <use href="#leaf" transform="translate(108 128) rotate(-150) scale(0.85 -0.85)" />
              <use href="#leaf" transform="translate(104.7 101) rotate(-40) scale(0.78)" />
              <use href="#leaf" transform="translate(105.6 73.8) rotate(-142) scale(0.7 -0.7)" />
              <use href="#leaf" transform="translate(111.2 46.2) rotate(-50) scale(0.6)" />
              <use href="#leaf" transform="translate(122 18) rotate(-68) scale(0.42)" />
            </g>
            <g class="seeds">
              <circle cx="158" cy="30" r="3" />
              <circle cx="171" cy="49" r="2" />
              <circle cx="62" cy="52" r="2.4" />
            </g>
          </svg>
        </figure>
      </section>

      <!-- The about section, left out for now. To bring it back, uncomment it and put your own paragraphs in:
      <section class="about" aria-labelledby="about-title">
        <h2 id="about-title">A little about me</h2>
        <p>…</p>
      </section>
      -->

      <section class="doors" aria-labelledby="doors-title">
        <h2 id="doors-title">Have a look around</h2>
        <ul>
          <li>
            <a class="door door--substack" href="/substack/">
              <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M40 7 C 24 8, 13 19, 12 37 C 26 36, 38 25, 40 7 Z" fill="currentColor" fill-opacity="0.18"/><path d="M41 6 C 30 17, 19 28, 7 42"/><path d="M28.5 19.5 L 33 21.5"/><path d="M21.5 26.5 L 25.5 30"/></svg>
              <span class="door-title">Substack</span>
              <span class="door-note">Notes and thoughts, now and then.</span>
              <span class="door-go">Read →</span>
            </a>
          </li>
          <li>
            <a class="door door--puzzles" href="/puzzles/">
              <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M25 24 c 1.5 -2.2 5 -1 4.6 2 c -0.5 3.8 -6 5 -8.6 1.6 c -3.2 -4.2 0.6 -10.2 6 -10 c 6.6 0.3 10.2 7 7.6 12.6 c -3 6.6 -12.4 8.4 -17.6 3.4 c -5.8 -5.6 -4.2 -16 2.6 -20.4 c 7.8 -5 19.2 -2 22.4 7"/></svg>
              <span class="door-title">Puzzles</span>
              <span class="door-note">Strokes, Mountweazel and the Puzzle Playlist.</span>
              <span class="door-go">Play →</span>
            </a>
          </li>
          <li>
            <a class="door door--poetry" href="/poetry/">
              <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" fill-opacity="0.18"><path d="M24 15 C 19.5 10.5, 21 4.5, 24 4.5 C 27 4.5, 28.5 10.5, 24 15"/><path d="M24 15 C 19.5 10.5, 21 4.5, 24 4.5 C 27 4.5, 28.5 10.5, 24 15" transform="rotate(72 24 15)"/><path d="M24 15 C 19.5 10.5, 21 4.5, 24 4.5 C 27 4.5, 28.5 10.5, 24 15" transform="rotate(144 24 15)"/><path d="M24 15 C 19.5 10.5, 21 4.5, 24 4.5 C 27 4.5, 28.5 10.5, 24 15" transform="rotate(216 24 15)"/><path d="M24 15 C 19.5 10.5, 21 4.5, 24 4.5 C 27 4.5, 28.5 10.5, 24 15" transform="rotate(288 24 15)"/></g><circle cx="24" cy="15" r="2.4"/><path d="M24 24 C 23 31, 25.5 37, 24 44"/><path d="M24.4 35 C 28 30.5, 32.5 29.5, 36 30.5 C 33.5 34.5, 29 36.5, 24.4 35 Z" fill="currentColor" fill-opacity="0.18"/></svg>
              <span class="door-title">Poetry</span>
              <span class="door-note">Poems, a few at a time.</span>
              <span class="door-go">Read →</span>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 funklunsford</p>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>funklunsford</title>
    <meta name="description" content="Strokes, Mountweazel and the Puzzle Playlist." />
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --label: #000000; --label-2: rgb(60 60 67 / 0.6); --tint: #00766f; --fill: rgb(118 118 128 / 0.12); }
      @media (prefers-color-scheme: dark) { :root { --bg: #000000; --label: #ffffff; --label-2: rgb(235 235 245 / 0.6); --tint: #63e6e2; --fill: rgb(118 118 128 / 0.24); } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-content: center; padding: 24px; background: var(--bg); color: var(--label); font: 17px/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      h1 { margin: 0 0 20px; font-size: 28px; text-align: center; }
      ul { display: grid; gap: 10px; width: min(320px, 100%); margin: 0; padding: 0; list-style: none; }
      a { display: block; padding: 14px 18px; border-radius: 12px; background: var(--fill); color: var(--tint); font-weight: 600; text-decoration: none; }
      a:hover { filter: brightness(0.96); }
      span { display: block; margin-top: 2px; color: var(--label-2); font-size: 14px; font-weight: 400; }
    </style>
  </head>
  <body>
    <main>
      <h1>funklunsford</h1>
      <ul>
        <li><a href="/strokes">Strokes <span>strokes.fun</span></a></li>
        <li><a href="/mountweazel">Mountweazel <span>Spot the made-up words</span></a></li>
        <li><a href="/puzzleplaylist">Puzzle Playlist <span>Today's puzzles, one tap each</span></a></li>
      </ul>
    </main>
  </body>
</html>

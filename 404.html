    <title>Not found</title>

    <!-- A deeper address under a short link forwards too, with the rest of its path, search and hash:
         funklunsford.com/puzzleplaylist/index.html#add=… goes to the playlist's own page. -->
    <script>
      (function () {
        var routes = {
          strokes: 'https://strokes.fun/',
          mountweazel: 'https://funklunsford.github.io/mountweazel/',
          puzzleplaylist: 'https://funklunsford.github.io/playlist/',
          playlist: 'https://funklunsford.github.io/playlist/'
        };
        var parts = location.pathname.split('/');
        var to = routes[(parts[1] || '').toLowerCase()];
        if (to) location.replace(to + parts.slice(2).join('/') + location.search + location.hash);
      })();
    </script>
